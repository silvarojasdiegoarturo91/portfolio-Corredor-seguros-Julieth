version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: seguros_julieth_db
    environment:
      POSTGRES_DB: seguros_julieth
      POSTGRES_USER: julieth
      POSTGRES_PASSWORD: seguros123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U julieth -d seguros_julieth"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: seguros_julieth_app
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://julieth:seguros123@postgres:5432/seguros_julieth?schema=public
      NODE_ENV: production
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
